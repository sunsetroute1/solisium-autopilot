[package]
name = "tl-route-investigator"
version = "0.1.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "tl-route-investigator"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "tl-route-investigator"
path = "src/main.rs"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tl_route_investigator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "phase1_probe"
path = "src/bin/phase1_probe.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sysinfo = "0.33"
netstat2 = "0.11"
network-interface = "2"
surge-ping = "0.8"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rfd = "0.15"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
